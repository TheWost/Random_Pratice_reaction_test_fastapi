[project]
name = "reaction-time-test"
version = "0.1.0"
description = "Reaction time benchmark with retro style by Python and fastapi"
readme = "README.md"
authors = [
    { name = "TheWost", email = "urbanskifilip63@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
